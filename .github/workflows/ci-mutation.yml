name: CI - Mutation Testing
permissions:
  contents: read

# PRs and pushes mutation-test only changed Rust lines. Monthly/manual full
# sweeps use dynamically planned Linux shards; ordinary CI already owns
# platform compatibility, so repeating the identical corpus on three OSes
# adds cost without increasing mutation coverage.

on:
  workflow_dispatch:
    inputs:
      file_filter:
        description: 'File glob (for example src/sync_layer/mod.rs); empty runs the full corpus'
        required: false
        default: ''
      test_timeout_seconds:
        description: 'Per-mutant test timeout in seconds (30-300)'
        required: false
        default: '180'

  pull_request:
    paths:
      - '.cargo/mutants.toml'
      - '.github/actions/install-cargo-tool/**'
      - '.github/workflows/ci-mutation.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'scripts/ci/aggregate_mutation_results.py'
      - 'scripts/tests/test_aggregate_mutation_results.py'
      - 'scripts/tests/test_ci_mutation_workflow.py'
      - 'src/**'
      - 'tests/**'

  schedule:
    - cron: '0 2 1 * *'  # First day of month at 2 AM UTC

  push:
    branches: [main]
    paths:
      - '.cargo/mutants.toml'
      - '.github/actions/install-cargo-tool/**'
      - '.github/workflows/ci-mutation.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'scripts/ci/aggregate_mutation_results.py'
      - 'scripts/tests/test_aggregate_mutation_results.py'
      - 'scripts/tests/test_ci_mutation_workflow.py'
      - 'src/**'
      - 'tests/**'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  baseline:
    name: Mutation Baseline and Plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      expected-mutants: ${{ steps.plan.outputs.expected-mutants }}
      scope: ${{ steps.plan.outputs.scope }}
      shard-count: ${{ steps.plan.outputs.shard-count }}
      shard-indexes: ${{ steps.plan.outputs.shard-indexes }}
      test-timeout: ${{ steps.plan.outputs.test-timeout }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable snapshot
        with:
          toolchain: stable

      - name: Install nextest
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-nextest

      - name: Install pinned cargo-mutants
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-mutants
          version: 27.1.0

      - name: Run authoritative baseline
        run: cargo nextest run --locked --all-targets --features tokio,json --no-capture

      - name: Plan exact mutation corpus
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          FILE_FILTER: ${{ inputs.file_filter }}
          TEST_TIMEOUT_SECONDS: ${{ inputs.test_timeout_seconds || '180' }}
        run: |
          set -euo pipefail

          if [[ ! "$TEST_TIMEOUT_SECONDS" =~ ^[0-9]+$ ]] \
            || [ "$TEST_TIMEOUT_SECONDS" -lt 30 ] \
            || [ "$TEST_TIMEOUT_SECONDS" -gt 300 ]; then
            echo "test_timeout_seconds must be an integer from 30 through 300"
            exit 1
          fi

          filter_args=()
          if [ "$EVENT_NAME" = "schedule" ]; then
            scope="full"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$FILE_FILTER" ]; then
            scope="full"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            scope="filtered"
            filter_args+=(--file "$FILE_FILTER")
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            scope="diff"
            if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "pull_request mutation scope requires a 40-character base SHA"
              exit 1
            fi
            git diff --binary --unified=0 "$BASE_SHA" HEAD -- '*.rs' > mutation-scope.diff
            filter_args+=(--in-diff mutation-scope.diff)
          elif [ "$EVENT_NAME" = "push" ]; then
            scope="diff"
            if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "push mutation scope requires a nonzero 40-character before SHA"
              exit 1
            fi
            git diff --binary --unified=0 "$BEFORE_SHA" HEAD -- '*.rs' > mutation-scope.diff
            filter_args+=(--in-diff mutation-scope.diff)
          else
            echo "unsupported mutation event: $EVENT_NAME"
            exit 1
          fi

          cargo mutants --list --json "${filter_args[@]}" > mutation-list.json
          expected_mutants="$(jq 'length' mutation-list.json)"
          shard_count="$(( (expected_mutants + 49) / 50 ))"
          if [ "$shard_count" -lt 1 ]; then
            shard_count="1"
          elif [ "$shard_count" -gt 96 ]; then
            echo "planned corpus needs $shard_count shards; maximum is 96"
            exit 1
          fi
          shard_indexes="$(jq -cn --argjson count "$shard_count" '[range(0; $count)]')"

          {
            echo "expected-mutants=$expected_mutants"
            echo "scope=$scope"
            echo "shard-count=$shard_count"
            echo "shard-indexes=$shard_indexes"
            echo "test-timeout=$TEST_TIMEOUT_SECONDS"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Mutation Plan"
            echo ""
            echo "- Scope: $scope"
            echo "- Mutants: $expected_mutants"
            echo "- Shards: $shard_count (target: at most 50 mutants each)"
            echo "- Per-mutant timeout: ${TEST_TIMEOUT_SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation plan
        uses: actions/upload-artifact@v7
        with:
          name: mutation-plan
          path: |
            mutation-list.json
            mutation-scope.diff
          if-no-files-found: warn
          retention-days: 30

  mutation-testing:
    name: Mutation Testing (${{ matrix.shard-index }}/${{ needs.baseline.outputs.shard-count }})
    needs: [baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 240

    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard-index: ${{ fromJSON(needs.baseline.outputs.shard-indexes) }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable snapshot
        with:
          toolchain: stable

      - name: Install nextest
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-nextest

      - name: Install pinned cargo-mutants
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-mutants
          version: 27.1.0

      - name: Run bounded mutation shard
        id: mutants
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          FILE_FILTER: ${{ inputs.file_filter }}
          MUTATION_SCOPE: ${{ needs.baseline.outputs.scope }}
          SHARD_COUNT: ${{ needs.baseline.outputs.shard-count }}
          SHARD_INDEX: ${{ matrix.shard-index }}
          TEST_TIMEOUT_SECONDS: ${{ needs.baseline.outputs.test-timeout }}
        run: |
          set -euo pipefail

          filter_args=()
          case "$MUTATION_SCOPE" in
            diff)
              if [ "$EVENT_NAME" = "pull_request" ]; then
                git diff --binary --unified=0 "$BASE_SHA" HEAD -- '*.rs' > mutation-scope.diff
              elif [ "$EVENT_NAME" = "push" ]; then
                git diff --binary --unified=0 "$BEFORE_SHA" HEAD -- '*.rs' > mutation-scope.diff
              else
                echo "diff scope is invalid for event $EVENT_NAME"
                exit 1
              fi
              filter_args+=(--in-diff mutation-scope.diff)
              ;;
            filtered)
              filter_args+=(--file "$FILE_FILTER")
              ;;
            full)
              ;;
            *)
              echo "unknown mutation scope: $MUTATION_SCOPE"
              exit 1
              ;;
          esac

          shard="${SHARD_INDEX}/${SHARD_COUNT}"
          cargo mutants --list --json --sharding round-robin \
            --shard "$shard" "${filter_args[@]}" > mutation-list.json
          selected_mutants="$(jq 'length' mutation-list.json)"

          set +e
          cargo mutants \
            --no-shuffle \
            --sharding round-robin \
            --shard "$shard" \
            --baseline=skip \
            --timeout "$TEST_TIMEOUT_SECONDS" \
            --in-place \
            --output mutants-out \
            --annotations github \
            "${filter_args[@]}" 2>&1 | tee mutants.log
          pipeline_status=("${PIPESTATUS[@]}")
          command_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          set -e

          if [ "$tee_status" -ne 0 ]; then
            command_status="70"
          fi

          outcomes="mutants-out/mutants.out/outcomes.json"
          if [ ! -f "$outcomes" ] && [ "$selected_mutants" -eq 0 ] \
            && [ "$command_status" -eq 0 ]; then
            mkdir -p "$(dirname "$outcomes")"
            printf '%s\n' \
              '{"total_mutants":0,"caught":0,"missed":0,"timeout":0,"unviable":0}' \
              > "$outcomes"
          fi

          jq -n \
            --argjson shard_index "$SHARD_INDEX" \
            --argjson shard_count "$SHARD_COUNT" \
            --argjson selected_mutants "$selected_mutants" \
            --argjson command_status "$command_status" \
            '{shard_index: $shard_index, shard_count: $shard_count,
              selected_mutants: $selected_mutants, command_status: $command_status}' \
            > mutation-status.json

          {
            echo "## Mutation Shard $shard"
            echo ""
            echo "- Selected mutants: $selected_mutants"
            echo "- cargo-mutants status: $command_status"
          } >> "$GITHUB_STEP_SUMMARY"

          case "$command_status" in
            0|2|3)
              ;;
            *)
              echo "cargo-mutants failed with infrastructure/usage status $command_status"
              exit "$command_status"
              ;;
          esac

      - name: Upload mutation shard
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report-${{ matrix.shard-index }}-of-${{ needs.baseline.outputs.shard-count }}
          path: |
            mutation-list.json
            mutation-scope.diff
            mutation-status.json
            mutants-out/
            mutants.log
          if-no-files-found: warn
          retention-days: 30

  mutation-summary:
    name: Mutation Testing Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [baseline, mutation-testing]
    if: always()

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download mutation shards
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-report-*
          path: mutation-artifacts

      - name: Aggregate mutation policy
        env:
          EXPECTED_MUTANTS: ${{ needs.baseline.outputs.expected-mutants }}
          EXPECTED_SHARDS: ${{ needs.baseline.outputs.shard-count }}
          MUTATION_SCOPE: ${{ needs.baseline.outputs.scope }}
        run: |
          set -euo pipefail
          python3 scripts/ci/aggregate_mutation_results.py mutation-artifacts \
            --expected-shards "$EXPECTED_SHARDS" \
            --expected-mutants "$EXPECTED_MUTANTS" \
            --scope "$MUTATION_SCOPE" \
            --minimum-score 80 \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Require successful baseline and shard jobs
        env:
          BASELINE_RESULT: ${{ needs.baseline.result }}
          SHARD_RESULT: ${{ needs.mutation-testing.result }}
        run: |
          set -euo pipefail
          if [ "$BASELINE_RESULT" != "success" ] || [ "$SHARD_RESULT" != "success" ]; then
            echo "baseline=$BASELINE_RESULT shards=$SHARD_RESULT"
            exit 1
          fi
