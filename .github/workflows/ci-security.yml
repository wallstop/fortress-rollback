name: CI - Security
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/config.toml'
      - 'deny.toml'
      - 'supply-chain/**'
      - 'scripts/ci/check-advisory-dispositions.py'
      - 'scripts/tests/test_ci_security_workflow.py'
      - '.github/actions/install-pinned-nightly/**'
      - '.github/workflows/ci-security.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/config.toml'
      - 'deny.toml'
      - 'supply-chain/**'
      - 'scripts/ci/check-advisory-dispositions.py'
      - 'scripts/tests/test_ci_security_workflow.py'
      - '.github/actions/install-pinned-nightly/**'
      - '.github/workflows/ci-security.yml'
  workflow_dispatch:
  # Run security checks daily so disposition deadlines cannot remain stale.
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  # Supply chain security check using cargo-deny
  supply-chain-security:
    name: Supply Chain Security (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: root
            manifest: Cargo.toml
            lockfile: Cargo.lock
            license-config: deny.toml
          - workspace: fuzz
            manifest: fuzz/Cargo.toml
            lockfile: fuzz/Cargo.lock
            license-config: supply-chain/deny-fuzz-licenses.toml
          - workspace: loom
            manifest: loom-tests/Cargo.toml
            lockfile: loom-tests/Cargo.lock
            license-config: deny.toml
          - workspace: godot-emscripten
            manifest: tests/godot-emscripten/Cargo.toml
            lockfile: tests/godot-emscripten/Cargo.lock
            license-config: supply-chain/deny-godot-licenses.toml

    steps:
      - uses: actions/checkout@v7

      - name: Check advisory dispositions
        run: python3 scripts/ci/check-advisory-dispositions.py

      - name: Install cargo-audit
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-deny

      - name: RustSec audit (${{ matrix.workspace }})
        env:
          LOCKFILE: ${{ matrix.lockfile }}
        run: cargo audit --file "$LOCKFILE"

      - name: Deny policy (${{ matrix.workspace }})
        env:
          LICENSE_CONFIG: ${{ github.workspace }}/${{ matrix.license-config }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          cargo deny --manifest-path "$MANIFEST" --locked check advisories bans sources
          cargo deny --manifest-path "$MANIFEST" --locked --config "$LICENSE_CONFIG" check licenses

  # Unsafe code audit via cargo-geiger
  # Runs on every PR because the pull_request payload does not include changed
  # paths. Pushes remain limited to dependency changes; schedules/manual runs
  # provide recurring coverage.
  unsafe-audit:
    name: Unsafe Code Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      contains(toJSON(github.event.commits.*.modified), 'Cargo.toml') ||
      contains(toJSON(github.event.commits.*.modified), 'Cargo.lock') ||
      contains(toJSON(github.event.commits.*.added), 'Cargo.toml') ||
      contains(toJSON(github.event.commits.*.added), 'Cargo.lock')

    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot
        with:
          toolchain: stable

      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked

      - name: Configure sccache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true

      - name: Verify sccache is working
        id: sccache-check
        if: steps.sccache.outcome == 'success'
        run: ./scripts/ci/verify-sccache.sh
        continue-on-error: true

      - name: Clear sccache env on failure
        if: steps.sccache.outcome != 'success' || steps.sccache-check.outcome != 'success'
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: geiger-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            geiger-${{ runner.os }}-cargo-

      - name: Audit unsafe code in dependencies
        run: |
          set -u -o pipefail
          # Keep the ordinary Z3 dependency visible, but do not compile bundled Z3 from
          # source: cold native builds repeatedly exhausted this job's 20-minute budget.
          rm -f geiger-report.complete
          set +e
          cargo geiger --locked --features "sync-send graphical-examples trace-validation hot-join paranoid loom z3-verification tokio json" --lib 2>&1 | tee geiger-report.txt
          geiger_status="${PIPESTATUS[0]}"
          set -e
          if [ "${geiger_status}" -eq 1 ]; then
            geiger_error_count="$(
              awk '/^error:/ { count++ } END { print count + 0 }' geiger-report.txt
            )"
            if [ "${geiger_error_count}" -ne 1 ] \
              || ! awk '
                NF { last = $0 }
                END { exit(last ~ /^error: Found [1-9][0-9]* warnings$/ ? 0 : 1) }
              ' geiger-report.txt; then
              echo "ERROR: cargo-geiger producer failed: warning exit included incomplete or fatal output"
              exit "${geiger_status}"
            fi
            echo "cargo-geiger completed with its expected warning exit"
          elif [ "${geiger_status}" -ne 0 ]; then
            echo "ERROR: cargo-geiger producer failed with status ${geiger_status}"
            exit "${geiger_status}"
          fi
          if ! awk '
            $7 == "fortress-rollback" &&
            ($6 == ":)" || $6 == "?" || $6 == "!") &&
            $1 ~ /^[0-9]+\/[0-9]+$/ && $2 ~ /^[0-9]+\/[0-9]+$/ &&
            $3 ~ /^[0-9]+\/[0-9]+$/ && $4 ~ /^[0-9]+\/[0-9]+$/ &&
            $5 ~ /^[0-9]+\/[0-9]+$/ { found = 1 }
            END { exit(found ? 0 : 1) }
          ' geiger-report.txt; then
            echo "ERROR: cargo-geiger did not produce a complete fortress-rollback root row"
            exit 1
          fi
          touch geiger-report.complete
        env:
          CARGO_TERM_COLOR: never
          RUSTC_WRAPPER: ${{ steps.sccache-check.outputs.working == 'true' && 'sccache' || '' }}
          SCCACHE_GHA_ENABLED: ${{ steps.sccache-check.outputs.working == 'true' && 'true' || 'false' }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
          SCCACHE_STARTUP_NOTIFY_TIMEOUT: "60"
          SCCACHE_IDLE_TIMEOUT: "0"

      - name: Verify no unsafe in library code
        run: |
          set -euo pipefail
          test -f geiger-report.complete
          root_row="$(
            awk '
              $7 == "fortress-rollback" &&
              ($6 == ":)" || $6 == "?" || $6 == "!") &&
              $1 ~ /^[0-9]+\/[0-9]+$/ && $2 ~ /^[0-9]+\/[0-9]+$/ &&
              $3 ~ /^[0-9]+\/[0-9]+$/ && $4 ~ /^[0-9]+\/[0-9]+$/ &&
              $5 ~ /^[0-9]+\/[0-9]+$/ { row = $0 }
              END { print row }
            ' geiger-report.txt
          )"
          if ! test -n "$root_row"; then
            echo "ERROR: cargo-geiger report does not contain the fortress-rollback root row"
            exit 1
          fi
          unsafe_total="$(
            printf '%s\n' "$root_row" | awk '
              {
                total = 0
                for (field = 1; field <= 5; field++) {
                  split($field, counts, "/")
                  total += counts[1]
                }
                print total
              }
            '
          )"
          if [ "$unsafe_total" -ne 0 ]; then
            echo "ERROR: Unsafe code detected in fortress-rollback library: $root_row"
            exit 1
          fi
          echo "No unsafe code in fortress-rollback library: $root_row"

  # Unused dependencies check
  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Install nightly toolchain (required for udeps)
        id: nightly
        uses: ./.github/actions/install-pinned-nightly

      - name: Install cargo-udeps
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-udeps

      - name: Configure sccache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true

      - name: Verify sccache is working
        id: sccache-check
        if: steps.sccache.outcome == 'success'
        run: ./scripts/ci/verify-sccache.sh
        continue-on-error: true

      - name: Clear sccache env on failure
        if: steps.sccache.outcome != 'success' || steps.sccache-check.outcome != 'success'
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: udeps-${{ steps.nightly.outputs.toolchain }}-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            udeps-${{ steps.nightly.outputs.toolchain }}-${{ runner.os }}-cargo-

      - name: Check for unused dependencies
        run: cargo udeps --all-targets
        continue-on-error: true  # Warn but don't fail build
        env:
          RUSTC_WRAPPER: ${{ steps.sccache-check.outputs.working == 'true' && 'sccache' || '' }}
          SCCACHE_GHA_ENABLED: ${{ steps.sccache-check.outputs.working == 'true' && 'true' || 'false' }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
          SCCACHE_STARTUP_NOTIFY_TIMEOUT: "60"
          SCCACHE_IDLE_TIMEOUT: "0"

  # Dependency freshness check
  outdated:
    name: Dependency Freshness (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on schedule or manual trigger (not on every PR)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: root
            manifest: Cargo.toml
            lockfile: Cargo.lock
          - workspace: fuzz
            manifest: fuzz/Cargo.toml
            lockfile: fuzz/Cargo.lock
          - workspace: loom
            manifest: loom-tests/Cargo.toml
            lockfile: loom-tests/Cargo.lock
          - workspace: godot-emscripten
            manifest: tests/godot-emscripten/Cargo.toml
            lockfile: tests/godot-emscripten/Cargo.lock

    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot
        with:
          toolchain: stable

      - name: Install cargo-outdated
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-outdated

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: outdated-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            outdated-${{ runner.os }}-cargo-

      - name: Check for outdated dependencies (${{ matrix.workspace }})
        env:
          MANIFEST: ${{ matrix.manifest }}
          REPORT: ${{ runner.temp }}/outdated-report.txt
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          set -euo pipefail

          {
            echo "## Dependency Freshness Check: $WORKSPACE"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          cargo outdated --manifest-path "$MANIFEST" --root-deps-only 2>&1 | tee "$REPORT"
          test -s "$REPORT"
          {
            echo "Dependency lag is advisory; command and report failures are blocking."
            echo ""
            echo '```'
            cat "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
