name: CI - Simulation Tests (Nightly)
permissions:
  contents: read
  actions: read

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: simulation-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORTRESS_SIM_TIER: nightly
  FORTRESS_SIM_SEED_BASE: ${{ github.run_id }}

jobs:
  simulation-nightly:
    name: Deterministic Simulation Fleet
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-nextest

      - name: Configure sccache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true

      - name: Verify sccache is working
        id: sccache-check
        if: steps.sccache.outcome == 'success'
        run: ./scripts/ci/verify-sccache.sh
        continue-on-error: true

      - name: Clear sccache env on failure
        if: steps.sccache.outcome != 'success' || steps.sccache-check.outputs.working != 'true'
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=" >> "$GITHUB_ENV"

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: simulation-nightly-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            simulation-nightly-${{ runner.os }}-cargo-
            network-nightly-${{ runner.os }}-cargo-

      - name: Prepare sometimes-state census directory
        run: |
          set -euo pipefail
          census_dir="$RUNNER_TEMP/simulation-census"
          case "$census_dir" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "refusing unsafe census path: $census_dir" >&2; exit 1 ;;
          esac
          rm -rf -- "$census_dir"
          mkdir -p "$census_dir"

      - name: Run sharded fleet and targeted probes
        run: >-
          cargo nextest run
          --profile ci-simulation-nightly
          --release
          --run-ignored ignored-only
          -E 'test(simulation::fleet::nightly_seed_shard_) or test(simulation::fleet::h_skew_hour_equivalent_measures_lag_correction_and_cost) or test(simulation::fleet::h_osc_aggregation_pressure_is_measured_and_decays) or test(simulation::census::h_bloat_scale_fragmentation_interaction_is_bounded_and_recovers) or test(simulation::census::h_pollcap_targeted_release_defers_without_starvation)'
          --test simulation
          --features hot-join
          --no-capture
        env:
          FORTRESS_SIM_CENSUS_DIR: ${{ runner.temp }}/simulation-census
          RUSTC_WRAPPER: ${{ steps.sccache-check.outputs.working == 'true' && 'sccache' || '' }}
          SCCACHE_GHA_ENABLED: ${{ steps.sccache-check.outputs.working == 'true' && 'true' || 'false' }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
          SCCACHE_STARTUP_NOTIFY_TIMEOUT: "60"
          SCCACHE_IDLE_TIMEOUT: "0"

      - name: Merge and validate sometimes-state census
        if: always()
        run: >-
          cargo test
          --release
          --test simulation
          --features hot-join
          simulation::sometimes_state::merge_nightly_sometimes_state_census
          --
          --ignored
          --exact
          --nocapture
        env:
          FORTRESS_SIM_CENSUS_DIR: ${{ runner.temp }}/simulation-census
          RUSTC_WRAPPER: ${{ steps.sccache-check.outputs.working == 'true' && 'sccache' || '' }}
          SCCACHE_GHA_ENABLED: ${{ steps.sccache-check.outputs.working == 'true' && 'true' || 'false' }}
          SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
          SCCACHE_STARTUP_NOTIFY_TIMEOUT: "60"
          SCCACHE_IDLE_TIMEOUT: "0"

      - name: Upload sometimes-state census
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-sometimes-state-census-${{ github.run_id }}
          path: ${{ runner.temp }}/simulation-census/published/
          if-no-files-found: error
          retention-days: 30

      - name: Upload violation-site observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-violation-sites-${{ github.run_id }}
          path: ${{ runner.temp }}/simulation-census/violation-sites/
          if-no-files-found: error
          retention-days: 30

      - name: Upload simulation failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simulation-nightly-failures-${{ github.run_id }}
          path: target/sim-artifacts/
          if-no-files-found: warn
          retention-days: 7

  # Runs the full test suite once with the exact census hook enabled. The hook
  # records every production `report_violation!` location that the suite
  # actually reports, so the census does not rely on LLVM line attribution. The
  # primary optional features are enabled so feature-gated assertions count too.
  violation-site-observations:
    name: Violation-Site Exact Observations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master snapshot
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-nextest

      - name: Setup Rust cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-key: violation-census

      - name: Prepare exact observation directory
        run: |
          set -euo pipefail
          observations_dir="$RUNNER_TEMP/violation-observations"
          case "$observations_dir" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "refusing unsafe observation path: $observations_dir" >&2; exit 1 ;;
          esac
          rm -rf -- "$observations_dir"
          mkdir -p "$observations_dir"

      - name: Run the full suite with the census hook
        env:
          FORTRESS_VIOLATION_CENSUS_DIR: ${{ runner.temp }}/violation-observations
        run: cargo nextest run --profile ci --features tokio,json,hot-join,violation-census

      - name: Upload exact observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: violation-site-observations-${{ github.run_id }}
          path: ${{ runner.temp }}/violation-observations/
          if-no-files-found: error
          retention-days: 30

  # Joins the content-addressed production violation-site baseline against
  # exact test-suite observations, the latest main coverage, and this run's
  # fleet observations. The report is informational: it publishes the
  # unexercised set for review without gating on a coverage threshold.
  violation-site-census:
    name: Violation-Site Exercise Census
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [simulation-nightly, violation-site-observations]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download fleet observations
        uses: actions/download-artifact@v7
        with:
          name: simulation-violation-sites-${{ github.run_id }}
          path: ${{ runner.temp }}/violation-sites

      - name: Download exact test-suite observations
        uses: actions/download-artifact@v7
        with:
          name: violation-site-observations-${{ github.run_id }}
          path: ${{ runner.temp }}/violation-observations

      - name: Download latest main test coverage (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          if ! run_id="$(gh run list --workflow=ci-coverage.yml --branch=main \
            --status=success --limit=1 --json databaseId --jq '.[0].databaseId')"; then
            echo "::warning::could not locate a successful main coverage run"
            exit 0
          fi
          if ! gh run download "$run_id" --name coverage-xml \
            --dir "$RUNNER_TEMP/coverage"; then
            echo "::warning::could not download coverage artifact from run $run_id"
          fi

      - name: Generate violation-site exercise report
        run: |
          coverage_args=()
          if [ -f "$RUNNER_TEMP/coverage/cobertura.xml" ]; then
            coverage_args=(--coverage-xml "$RUNNER_TEMP/coverage/cobertura.xml")
          fi
          python3 scripts/simulation/violation_census.py \
            "${coverage_args[@]}" \
            --fleet-dir "$RUNNER_TEMP/violation-sites" \
            --observations-dir "$RUNNER_TEMP/violation-observations" \
            --output "$RUNNER_TEMP/violation-site-census.json"

      - name: Upload violation-site exercise report
        uses: actions/upload-artifact@v7
        with:
          name: violation-site-census-${{ github.run_id }}
          path: ${{ runner.temp }}/violation-site-census.json
          retention-days: 30
