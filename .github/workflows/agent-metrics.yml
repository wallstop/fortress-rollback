name: Agent Metrics
on:
  workflow_dispatch:
    inputs:
      days:
        type: number
        default: 90
permissions:
  contents: read
concurrency:
  group: agent-metrics-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  metrics:
    uses: Ambiguous-Interactive/review-tools/.github/workflows/agent-metrics.yml@e37d0ef1195ee247382c92dd8f6370c0b732960b  # v1.0.0
    with:
      days: ${{ inputs.days || 90 }}
      timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
