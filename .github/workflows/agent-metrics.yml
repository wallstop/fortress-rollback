name: Agent Metrics
on:
  workflow_dispatch:
    inputs:
      days:
        type: string
        default: '90'
permissions:
  contents: read
concurrency:
  group: agent-metrics-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  metrics:
    uses: Ambiguous-Interactive/review-tools/.github/workflows/agent-metrics.yml@d8aab4dc3655924360ff17ebb04bbc3a844a493f  # v1.1.0
    with:
      days: ${{ fromJSON(inputs.days || '90') }}
      timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
