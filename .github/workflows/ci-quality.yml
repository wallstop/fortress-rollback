name: CI - Code Quality

# Additional static analysis tools for enhanced code quality
# Includes:
# - typos: Fast spell checker for source code
# - Ruff: Python correctness and security linting
# - cargo-spellcheck: Spelling and grammar in documentation
# - cargo-shear: Fast unused dependency detection
#
# Note: typos, Ruff, and cargo-shear are blocking. cargo-spellcheck remains an
# advisory diagnostic because its natural-language findings require judgment.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fuzz/**'
      - 'loom-tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - '**.md'
      - '.typos.toml'
      - '.config/spellcheck.toml'
      - 'ruff.toml'
      - 'scripts/**/*.py'
      - '.github/**/*.py'
      - '.github/actions/install-cargo-tool/**'
      - '.github/workflows/ci-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'fuzz/**'
      - 'loom-tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - '**.md'
      - '.typos.toml'
      - '.config/spellcheck.toml'
      - 'ruff.toml'
      - 'scripts/**/*.py'
      - '.github/**/*.py'
      - '.github/actions/install-cargo-tool/**'
      - '.github/workflows/ci-quality.yml'
  schedule:
    # Run weekly on Sundays at 4 AM UTC (after safety checks at 3 AM)
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # TYPOS - FAST SOURCE CODE SPELL CHECKER
  # ============================================================================
  typos:
    name: Spell Check (typos)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check spelling with typos
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          config: .typos.toml

  # ============================================================================
  # RUFF - PYTHON CORRECTNESS AND SECURITY LINTING
  # ============================================================================
  python-static-analysis:
    name: Python Static Analysis (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check Python scripts
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: check --output-format=github
          src: >-
            scripts
            .github

  # ============================================================================
  # CARGO SHEAR - FAST UNUSED DEPENDENCY DETECTION
  # ============================================================================
  unused-deps-fast:
    name: Unused Dependencies (cargo-shear)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot

      - name: Install cargo-shear
        run: |
          set -euo pipefail
          cargo_shear_version="1.13.3"
          cargo_shear_archive="$RUNNER_TEMP/cargo-shear-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 3 \
            --output "$cargo_shear_archive" \
            "https://github.com/Boshen/cargo-shear/releases/download/v${cargo_shear_version}/cargo-shear-x86_64-unknown-linux-musl.tar.gz"
          echo "21ba04662e0eaa6059ca7e1adf48f3bdf1c6656b613b926f3bda0dc6f5b38f82  $cargo_shear_archive" \
            | sha256sum --check
          tar -xzf "$cargo_shear_archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/cargo-shear" /usr/local/bin/cargo-shear
          cargo shear --version

      - name: Check for unused dependencies
        run: |
          set -euo pipefail

          {
            echo "## Unused Dependencies Check (cargo-shear)"
            echo ""
            echo "Fast regex-based detection across every tracked Cargo workspace."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          mapfile -t workspace_roots < <(
            python3 scripts/release/workspace_locks.py list |
              sed -n 's/^workspace_root=//p'
          )
          if [ "${#workspace_roots[@]}" -eq 0 ]; then
            echo "No tracked Cargo workspaces discovered." >&2
            exit 1
          fi

          : > shear-output.txt
          for workspace_root in "${workspace_roots[@]}"; do
            echo "=== cargo-shear: $workspace_root ===" | tee -a shear-output.txt
            cargo shear --locked --deny-warnings --color never "$workspace_root" \
              2>&1 | tee -a shear-output.txt
          done
          echo "✅ No unused dependencies or cargo-shear warnings detected" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload shear report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shear-report
          path: shear-output.txt
          retention-days: 7

  # ============================================================================
  # CARGO SPELLCHECK - DOCUMENTATION SPELLING
  # ============================================================================
  spellcheck:
    name: Documentation Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      issues-found: ${{ steps.spellcheck.outputs.issues-found }}
      issue-count: ${{ steps.spellcheck.outputs.issue-count }}
      tool-failed: ${{ steps.spellcheck.outputs.tool-failed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot

      - name: Install cargo-spellcheck
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-spellcheck
          version: 0.15.1

      - name: Check spelling in documentation
        id: spellcheck
        run: |
          {
            echo "## Documentation Spelling Check"
            echo ""
            echo "Checking spelling in doc comments and markdown files..."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Run spellcheck on Rust doc comments
          # Use -m 1 so findings are machine-detectable, then keep this job
          # advisory by handling the status explicitly. Limit to Hunspell so
          # the checked-in Hunspell quirks are the active spelling policy.
          set -o pipefail
          spellcheck_status=0
          cargo spellcheck check --checkers hunspell -m 1 2>&1 | tee spellcheck-output.txt || spellcheck_status=$?

          ISSUE_COUNT=$(grep -cE "^(error|warning):|error: spellcheck|warning:" spellcheck-output.txt || true)
          ISSUE_COUNT=${ISSUE_COUNT:-0}
          echo "issue-count=$ISSUE_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$ISSUE_COUNT" -eq 0 ] && [ "$spellcheck_status" -eq 0 ]; then
            echo "issues-found=false" >> "$GITHUB_OUTPUT"
            echo "tool-failed=false" >> "$GITHUB_OUTPUT"
            echo "✅ No spelling issues found in documentation" >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$ISSUE_COUNT" -eq 0 ]; then
              echo "issues-found=false" >> "$GITHUB_OUTPUT"
              echo "tool-failed=true" >> "$GITHUB_OUTPUT"
            else
              echo "issues-found=true" >> "$GITHUB_OUTPUT"
              echo "tool-failed=false" >> "$GITHUB_OUTPUT"
            fi
            {
              if [ "$ISSUE_COUNT" -eq 0 ]; then
                echo "⚠️ cargo-spellcheck exited with status $spellcheck_status but emitted no parsed findings:"
              else
                echo "⚠️ Found potential spelling issues ($ISSUE_COUNT):"
              fi
              echo ""
              echo "<details>"
              echo "<summary>Click to expand</summary>"
              echo ""
              echo "\`\`\`"
              head -100 spellcheck-output.txt
              echo "\`\`\`"
              echo ""
              echo "</details>"
              echo ""
              echo "Run \`cargo spellcheck fix\` locally to auto-fix issues."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload spellcheck report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spellcheck-report
          path: spellcheck-output.txt
          retention-days: 7

  # ============================================================================
  # SUMMARY
  # ============================================================================
  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [typos, python-static-analysis, unused-deps-fast, spellcheck]
    if: always()

    steps:
      - name: Generate summary
        run: |
          map_job_status() {
            case "$1" in
              success) echo "✅ Completed" ;;
              failure) echo "⚠️ Failed" ;;
              skipped) echo "⏭️ Skipped" ;;
              cancelled) echo "🚫 Cancelled" ;;
              *) echo "❓ Unknown" ;;
            esac
          }

          map_advisory_status() {
            if [ "${4:-false}" = "true" ]; then
              echo "⚠️ Tool Failed"
            elif [ "$1" = "true" ]; then
              if [ -n "${2:-}" ] && [ "$2" != "0" ]; then
                echo "⚠️ Issues Found ($2)"
              else
                echo "⚠️ Issues Found"
              fi
            else
              map_job_status "$3"
            fi
          }

          {
            echo "## Code Quality Summary"
            echo ""
            echo "Typos, Ruff, and cargo-shear are blocking. cargo-spellcheck is advisory."
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Spell Check (typos) | $(map_job_status '${{ needs.typos.result }}') |"
            echo "| Python Static Analysis (Ruff) | $(map_job_status '${{ needs.python-static-analysis.result }}') |"
            echo "| Unused Dependencies (cargo-shear) | $(map_job_status '${{ needs.unused-deps-fast.result }}') |"
            echo "| Documentation Spelling | $(map_advisory_status '${{ needs.spellcheck.outputs.issues-found }}' '${{ needs.spellcheck.outputs.issue-count }}' '${{ needs.spellcheck.result }}' '${{ needs.spellcheck.outputs.tool-failed }}') |"
            echo ""
            echo "### Recommendations"
            echo ""
            echo "- Review any warnings in the individual job logs"
            echo "- Run \`typos\` locally to check for spelling issues in source code"
            echo "- Run \`ruff check scripts .github\` locally to check Python scripts"
            echo "- Run \`cargo shear --locked --deny-warnings\` locally to check dependencies"
            echo "- Run \`cargo spellcheck fix\` to auto-fix spelling issues"
          } >> "$GITHUB_STEP_SUMMARY"
