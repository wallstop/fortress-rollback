name: OpenAI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: openai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      ${{ !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type != 'Bot' }}
    uses: Ambiguous-Interactive/review-tools/.github/workflows/openai-review.yml@e37d0ef1195ee247382c92dd8f6370c0b732960b  # v1.0.0
    with:
      model: ${{ vars.OPENAI_REVIEW_MODEL }}
      effort: ${{ vars.OPENAI_REVIEW_EFFORT }}
      timeout-minutes: 15
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
