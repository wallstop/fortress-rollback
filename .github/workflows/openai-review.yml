name: OpenAI Review

# Calls the shared review in Ambiguous-Interactive/.github. It posts one COMMENT review per head
# commit and cannot block a merge. Drafts, forks and bots get no review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: openai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      ${{ !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type != 'Bot' }}
    uses: Ambiguous-Interactive/.github/.github/workflows/openai-review.yml@v1.0.0
    with:
      model: ${{ vars.OPENAI_REVIEW_MODEL }}
      effort: ${{ vars.OPENAI_REVIEW_EFFORT }}
      tools-ref: v1.0.0
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
