# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust dependencies (Cargo) - covers root workspace and all members
  # (includes: fortress-rollback, tests/network-peer)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "wallstop"
    reviewers:
      - "wallstop"
    commit-message:
      prefix: "chore(deps)"
    # Favor larger, area-grouped PRs over many single-package PRs.
    groups:
      cargo-workspace:
        patterns:
          - "*"
    ignore:
      # bincode-next 3.x requires Rust 1.90; retain the newest compatible 2.x
      # release until the repository deliberately raises its Rust 1.86 MSRV.
      - dependency-name: "bincode-next"
        update-types:
          - "version-update:semver-major"
      # serial_test 4.x requires Rust 1.93.1; retain the newest 3.x release
      # until the repository deliberately raises its declared Rust 1.86 MSRV.
      - dependency-name: "serial_test"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 2

  # Rust dependencies for fuzz directory (separate workspace)
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    assignees:
      - "wallstop"
    reviewers:
      - "wallstop"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-fuzz:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # Rust dependencies for loom-tests directory (separate workspace,
  # requires special --cfg loom flags that conflict with normal builds)
  - package-ecosystem: "cargo"
    directory: "/loom-tests"
    schedule:
      interval: "weekly"
    assignees:
      - "wallstop"
    reviewers:
      - "wallstop"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-loom-tests:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # Rust dependencies for the standalone Godot Emscripten smoke-test crate
  - package-ecosystem: "cargo"
    directory: "/tests/godot-emscripten"
    schedule:
      interval: "weekly"
    assignees:
      - "wallstop"
    reviewers:
      - "wallstop"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-godot-emscripten:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "wallstop"
    reviewers:
      - "wallstop"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-all:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    assignees:
      - "wallstop"
    reviewers:
      - "wallstop"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-all:
        patterns:
          - "*"
    open-pull-requests-limit: 1
    ignore:
      # Rust base image is intentionally pinned to MSRV (Minimum Supported Rust Version)
      # defined in Cargo.toml. The Dockerfile uses MSRV to ensure network tests validate
      # builds at the minimum supported version. CI tests latest stable separately.
      # Only update when MSRV changes in Cargo.toml.
      - dependency-name: "rust"

  # Development-container base images (kept separate from release/test images)
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    assignees:
      - "wallstop"
    reviewers:
      - "wallstop"
    commit-message:
      prefix: "chore(devcontainer)"
    groups:
      devcontainer-docker:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # Development-container features
  - package-ecosystem: "devcontainers"
    # The devcontainers updater discovers .devcontainer/devcontainer.json
    # relative to the configured directory, so it must start at repository root.
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "wallstop"
    reviewers:
      - "wallstop"
    commit-message:
      prefix: "chore(devcontainer)"
    groups:
      devcontainer-features:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # Documentation Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "wallstop"
    reviewers:
      - "wallstop"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-docs:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # Hash-locked release-preparation dependencies
  - package-ecosystem: "pip"
    directory: "/scripts/release"
    schedule:
      interval: "weekly"
    assignees:
      - "wallstop"
    reviewers:
      - "wallstop"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-release:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # Browser runtime dependencies for the Godot/Emscripten probe
  - package-ecosystem: "npm"
    directory: "/tests/godot-emscripten"
    schedule:
      interval: "weekly"
    assignees:
      - "wallstop"
    reviewers:
      - "wallstop"
    commit-message:
      prefix: "chore(deps)"
    groups:
      godot-emscripten-browser:
        patterns:
          - "*"
    open-pull-requests-limit: 1
