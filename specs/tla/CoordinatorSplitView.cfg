\* Split-view participant-set safety: the shipped agreed-epoch derivation.
\* The epoch is GROUP_B (5) + GROUP_F (3) + COORD (1) = 9 members, so the
\* quorum is 5. GROUP_B commits; GROUP_F can never commit.
SPECIFICATION Spec

CONSTANT GROUP_B = {b1, b2, b3, b4, b5}
CONSTANT GROUP_F = {f1, f2, f3}
CONSTANT COORD = {c}
CONSTANT MAX_CUT = 1
CONSTANT DERIVE_LOCAL_VIEW = FALSE
CONSTANT NO_CUT = 99

INVARIANT SafetyInvariant
PROPERTY EventuallyOneGroupCommits
