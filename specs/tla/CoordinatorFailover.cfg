\* Coordinator-failover policy: the deterministic coordinator is partitioned
\* away (COORD_AVAILABLE = FALSE), so the fallback quorum must commit.
SPECIFICATION LiveSpec

CONSTANT PEERS = {p0, p1, p2, p3}
CONSTANT COORD = p0
CONSTANT FALLBACK = p1
CONSTANT QUORUM = 3
CONSTANT MAX_RECEIPT = 2
CONSTANT MAX_CUT = 2
CONSTANT COORD_AVAILABLE = FALSE
CONSTANT NO_CUT = 99

INVARIANT SafetyInvariant
PROPERTY EventuallyFailoverCommits
