[package]
name = "network-test-peer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Headless network test peer for multi-process testing of fortress-rollback"

# This is an internal test tool, not published to crates.io
# It is a separate binary crate for multi-process tests, but it remains a member
# of the root workspace and therefore shares the root Cargo.lock.

[lints.clippy]
# Allow print macros for test output and error reporting. This headless peer
# writes its JSON results and diagnostics to stdout/stderr by contract, so the
# print-family lints (including the workspace-wide `disallowed-macros` rule from
# the root `clippy.toml`) are intentionally permitted for this internal tool.
print_stdout = "allow"
print_stderr = "allow"
disallowed_macros = "allow"

[features]
# Kept for callers that explicitly request the hot-join lane. The peer always
# links the feature below so its exhaustive FortressEvent match cannot drift
# from the variants another workspace member enables through feature unification.
hot-join = ["fortress-rollback/hot-join"]

[dependencies]
fortress-rollback = { path = "../..", features = ["hot-join"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "network_test_peer"
path = "src/main.rs"
