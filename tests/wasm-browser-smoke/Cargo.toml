[package]
name = "wasm-browser-smoke"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.86"

[lib]
doctest = false

[dependencies]
fortress-rollback = { path = "../.." }
fortress-replay-fixture = { path = "../replay-fixture" }
serde = { version = "1.0", features = ["derive"] }
web-time = "1.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"
