[package]
name = "wasm-browser-smoke"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.86"

[lib]
doctest = false

[features]
default = []
# Browser runtime probe for the feature-gated hot-join membership path. Kept
# non-default so workspace-wide builds do not silently unify the library into
# its hot-join configuration; the browser CI lane opts in explicitly.
hot-join = ["fortress-rollback/hot-join"]

[dependencies]
fortress-rollback = { path = "../.." }
fortress-replay-fixture = { path = "../replay-fixture" }
serde = { version = "1.0", features = ["derive"] }
web-time = "1.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"
